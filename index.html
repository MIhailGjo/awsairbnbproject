<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Search</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="search" role="search">
    <input id="searchInput" placeholder="Enter an address" aria-label="Address">
    <button id="searchBtn">Search</button>
  </div>
  <div id="results"></div>

  <section class="profile">
    <h2>Profile</h2>

    <div class="profile-header">
      <div class="avatar">M</div>
      <div>
        <div class="name">Your Name</div>
        <div class="meta">Member since 2026</div>
      </div>
    </div>

    <form onsubmit="return false;">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="jane@example.com">
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input id="location" type="text" placeholder="City, Country">
      </div>
      <div class="field">
        <label for="bio">About</label>
        <textarea id="bio" rows="3" placeholder="Tell hosts a bit about yourself"></textarea>
      </div>
      <button type="submit" class="save">Save</button>
    </form>
  </section>

  <footer class="version">v1.0.0</footer>

</body>
</html>

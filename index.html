<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Search</title>
  <!-- Page styles (colors, layout) -->
  <link rel="stylesheet" href="styles.css">
  <!-- Search logic; "defer" runs it after the page has loaded -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Search bar: type an address and click Search -->
  <div class="search-wrap">
    <div class="search" role="search">
      <input id="searchInput" placeholder="Enter an address" aria-label="Address" autocomplete="off">
      <button id="searchBtn">Search</button>
    </div>
    <!-- Dropdown of saved addresses, filled in by script.js while typing -->
    <ul id="suggestions"></ul>
  </div>
  <!-- Search results get filled in here by script.js -->
  <div id="results"></div>

  <!-- Profile card (static for now, Save does nothing yet) -->
  <section class="profile">
    <h2>Profile</h2>

    <!-- Avatar circle, name and member date -->
    <div class="profile-header">
      <div class="avatar">M</div>
      <div>
        <div class="name">Your Name</div>
        <div class="meta">Member since 2026</div>
      </div>
    </div>

    <!-- Profile form; "return false" stops the page from reloading -->
    <form onsubmit="return false;">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="jane@example.com">
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input id="location" type="text" placeholder="City, Country">
      </div>
      <div class="field">
        <label for="bio">About</label>
        <textarea id="bio" rows="3" placeholder="Tell hosts a bit about yourself"></textarea>
      </div>
      <button type="submit" class="save">Save</button>
    </form>
  </section>

  <!-- Version number: bump this when you release changes -->
  <footer class="version">v1.0.3</footer>

</body>
</html>
